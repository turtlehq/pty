name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test

  live-tts:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Live tts on PATH (optional)
        run: |
          if command -v tts >/dev/null 2>&1; then
            BUN_TEST_REAL_TTS=1 bun test test/completion-projection.test.ts
          else
            echo "tts not on PATH — skipped"
          fi
